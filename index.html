<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Jade 2.0 Brochure Project</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; background: #000; color: #f5f5f7; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Inter, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; text-align: center; padding: 24px;
  }
  .orb { position: relative; width: min(56vw, 220px); aspect-ratio: 1; cursor: pointer; touch-action: none; margin-bottom: 56px; }
  .orb::before {
    content: ""; position: absolute; inset: -30%; border-radius: 50%;
    background: radial-gradient(circle, rgba(52,211,153,.22), transparent 62%);
    filter: blur(24px); opacity: .7; animation: breathe 4s ease-in-out infinite;
    transform: translate(var(--px,0px), var(--py,0px)); transition: transform .3s ease-out;
  }
  svg { position: relative; width: 100%; height: 100%; overflow: visible; transform: translate(var(--px,0px), var(--py,0px)) scale(var(--s,1)); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .track { fill: none; stroke: #1c1c1e; stroke-width: 3; }
  .arc { fill: none; stroke: url(#g); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 120 400; transform-origin: 50% 50%; animation: spin 1.8s cubic-bezier(.5,.1,.5,.9) infinite; }
  .arc2 { stroke-dasharray: 30 400; opacity: .35; animation-duration: 2.6s; animation-direction: reverse; }
  .orb.active { --s: 1.06; }
  .orb.active .arc { animation-duration: .9s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { opacity: 1; transform: translate(var(--px,0px), var(--py,0px)) scale(1.08); } }
  h1 { margin: 0 0 14px; font-size: clamp(26px, 5vw, 44px); font-weight: 600; letter-spacing: -.02em; }
  .status { display: inline-flex; align-items: center; gap: 10px; font-size: clamp(16px, 2.4vw, 19px); color: #34d399; font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .note { position: fixed; left: 24px; right: 24px; bottom: calc(32px + env(safe-area-inset-bottom, 0px)); margin: 0; font-size: 14px; color: #86868b; }
  @media (prefers-reduced-motion: reduce) { .arc, .orb::before, .dot { animation-duration: 8s; } }
</style>
</head>
<body>
  <div class="orb" id="orb" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#059669"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="50" cy="50" r="46"/>
      <circle class="arc arc2" cx="50" cy="50" r="38"/>
      <circle class="arc" cx="50" cy="50" r="46"/>
    </svg>
  </div>
  <h1>Jade 2.0 Brochure Project</h1>
  <div class="status" role="status"><span class="dot"></span>In Progress</div>
  <p class="note">Please allow up to 48 hours for project completion.</p>
<script>
  const orb = document.getElementById('orb');
  const move = e => {
    const r = orb.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width/2)) / innerWidth;
    const dy = (e.clientY - (r.top + r.height/2)) / innerHeight;
    orb.style.setProperty('--px', dx * 24 + 'px');
    orb.style.setProperty('--py', dy * 24 + 'px');
  };
  addEventListener('pointermove', move);
  orb.addEventListener('pointerdown', () => orb.classList.add('active'));
  addEventListener('pointerup', () => orb.classList.remove('active'));
</script>
</body>
</html>
